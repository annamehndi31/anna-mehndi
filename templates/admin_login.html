<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: white; padding: 2rem; border-radius: 12px; width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        h2 { text-align: center; margin-bottom: 1.5rem; color: #1a1a2e; }
        input { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 2px solid #eee; border-radius: 6px; font-size: 1rem; }
        input:focus { border-color: #e94560; outline: none; }
        button { width: 100%; background: #e94560; color: white; padding: 0.8rem; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #c73652; }
        .error { color: red; text-align: center; margin-bottom: 1rem; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔐 Admin Login</h2>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="POST">
            <input type="password" name="password" placeholder="Enter admin password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
